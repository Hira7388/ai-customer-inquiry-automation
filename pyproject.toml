[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-customer-inquiry-automation"
version = "0.1.0"
description = "Customer inquiry workflow automation portfolio project"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "starlette>=0.46,<1",
    "anyio>=4,<4.15",
    "uvicorn>=0.30,<1",
    "python-dotenv>=1,<2",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
